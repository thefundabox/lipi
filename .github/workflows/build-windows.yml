name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the installer to a GitHub Release when a v* tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Download OCR models to bundle
        run: python packaging/fetch_models.py

      - name: Build Lipi.exe
        run: pyinstaller packaging/lipi.spec --noconfirm

      - name: Self-test the built app (English + Hindi OCR, Kruti Dev, Word export, web page)
        run: dist\Lipi\Lipi.exe --selftest packaging\selftest.pdf

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $env:LIPI_VERSION = if ($env:GITHUB_REF_NAME -like "v*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.1.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Zip portable version
        shell: pwsh
        run: Compress-Archive -Path dist\Lipi -DestinationPath dist\Lipi-portable-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lipi-windows
          path: |
            dist/Lipi-Setup.exe
            dist/Lipi-portable-windows.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Lipi-Setup.exe
            dist/Lipi-portable-windows.zip
